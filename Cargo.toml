[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
cap-std = "=4.0.3"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
dotenvy = "0.15.7"
futures = "0.3.34"
libc = "0.2"
monty-alloc = { version = "=1.0.0", features = ["exit-code"] }
monty-pool = "=1.0.0"
monty-proto = { version = "=1.0.0", features = ["worker"] }
monty-types = "=1.0.0"
ratatui = "0.30"
ratatui-textarea = "0.9"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }
toml = "1.1.6"
toml_edit = "0.25"
unicode-segmentation = "1.13"
